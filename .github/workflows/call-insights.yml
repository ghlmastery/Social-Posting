name: Fathom call insights

on:
  # Schedule disabled: FATHOM_API_KEY etc. aren't set as repo secrets yet
  # (this workspace's egress policy also currently blocks api.fathom.ai from
  # the sandbox that built this), so every run was failing and spamming
  # GitHub failure emails. Re-enable by uncommenting once secrets are
  # configured (docs/SETUP.md §7). 10:00 UTC ~= 06:00 America/Toronto (EDT),
  # an hour ahead of daily-ideas.yml (11:00 UTC) so synced themes are
  # committed before that job's checkout picks them up.
  # schedule:
  #   - cron: "0 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: call-insights
  cancel-in-progress: false

jobs:
  call-insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Run call insights job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          FATHOM_API_KEY: ${{ secrets.FATHOM_API_KEY }}
          FATHOM_API_BASE_URL: ${{ vars.FATHOM_API_BASE_URL }}
          FATHOM_INTERNAL_EMAIL_DOMAINS: ${{ vars.FATHOM_INTERNAL_EMAIL_DOMAINS }}
          FATHOM_LOOKBACK_DAYS: ${{ vars.FATHOM_LOOKBACK_DAYS }}
          FATHOM_INCLUDE_TRANSCRIPT: ${{ vars.FATHOM_INCLUDE_TRANSCRIPT }}
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_OUTPUT_FOLDER_ID }}
          STATE_FILE_PATH: ./data/state.json
        run: npm run job:call-insights

      - name: Persist state
        # Generated markdown in output/ is written to Google Drive (when
        # GOOGLE_DRIVE_OUTPUT_FOLDER_ID is set) rather than committed here —
        # only the dedupe/sync-cursor state needs to live in the repo.
        run: |
          git config user.name "social-posting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "chore: sync Fathom call insights [skip ci]"
          git push
